# Trusted Enterprise Agent — local development stack.
# Stage 0: api + db. Frontend (Angular) service is added in Stage 7.
services:
  api:
    build: ./backend
    container_name: tea-api
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/code/app        # hot-reload: edit code, see changes instantly
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:16-alpine
    container_name: tea-db
    environment:
      POSTGRES_USER: tea
      POSTGRES_PASSWORD: tea
      POSTGRES_DB: tea
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tea"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
