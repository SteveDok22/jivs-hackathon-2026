server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: unknown paths return index.html, Angular handles routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend service. In AWS the target is set via
    # the API_URL build arg / task definition; locally it is the api container.
    location ~ ^/(agent|eval|pii|guardrails|health) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
