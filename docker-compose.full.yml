# Full stack: db + api + frontend behind nginx. Use for the "everything runs
# in the cloud in hour one" rehearsal:  docker compose -f docker-compose.full.yml up --build
services:
  api:
    build: ./backend
    container_name: tea-api
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: tea-db
    environment:
      POSTGRES_USER: tea
      POSTGRES_PASSWORD: tea
      POSTGRES_DB: tea
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tea"]
      interval: 3s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    container_name: tea-frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
