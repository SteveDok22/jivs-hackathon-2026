[project]
name = "trusted-enterprise-agent"
version = "0.1.0"
description = "JiVS Hackathon 2026 — Trusted Enterprise Agent core"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "anthropic>=0.40",
    "boto3>=1.35",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "duckdb>=1.0",
    "faker>=26.0",
    "rapidfuzz>=3.9",
    "unidecode>=1.3",
    "presidio-analyzer>=2.2",
    "spacy>=3.7",
    "sqlglot>=25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",        # required by FastAPI TestClient
    "ruff>=0.6",
]
# Azure SQL access (their 2025 setup). Requires ODBC Driver 18 installed locally.
mssql = [
    "pyodbc>=5.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]   # errors, pyflakes, imports, pyupgrade, bugbear

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
